<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="referrer" content="no-referrer" />
<title>轨道播报舱 · ORBITAL NEWS POD</title>
<style>
/* =========================================================
   轨道播报舱 · ORBITAL NEWS POD
   ========================================================= */

:root{
  --bg:#03050b;
  --ink:#eaf3ff;
  --muted:rgba(196,215,240,.62);
  --faint:rgba(180,205,235,.36);
  --cyan:#7fe9ff;
  --mint:#8df0c4;
  --amber:#ffca7a;
  --line:rgba(150,200,255,.18);
  --glass:rgba(11,19,34,.62);
  --fw:clamp(18px, 2.2vh, 28px);
  --frame:0px;
  --ring-scale:1;
  /* 摆件尺寸：植株比原始尺寸小 1/6；水壶等比例缩到植株高度的 2/3 */
  --jar-scale:0.8333;
  --jar-w:calc(clamp(104px, 10.4vw, 168px) * var(--jar-scale));
  --can-w:calc(var(--jar-w) * 0.372);
  --pour-lift:60px;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
}

*{box-sizing:border-box;}

html,body{height:100%;}

body{
  margin:0;
  background:
    radial-gradient(140% 120% at 50% 0%, #0a1224 0%, #05070f 55%, #010205 100%);
  color:var(--ink);
  font-family:var(--font);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}

/* ---------- 窗口本体 ---------- */
.app{
  position:fixed;
  inset:var(--frame);
  border-radius:0;
  overflow:hidden;
  isolation:isolate;
  background:#04060e;
  box-shadow:
    0 0 0 1px rgba(150,200,255,.16),
    0 24px 70px rgba(0,0,0,.75),
    0 0 120px rgba(60,120,255,.10);
}

/* ---------- 太空背景 ---------- */
.space{position:absolute;inset:0;z-index:0;overflow:hidden;}

.starfield{
  position:absolute;inset:0;width:100%;height:100%;display:block;
}

.nebula{
  position:absolute;
  border-radius:50%;
  filter:blur(60px);
  mix-blend-mode:screen;
  pointer-events:none;
}
.nebula--a{
  left:-14%;top:-22%;width:60%;height:70%;
  background:radial-gradient(circle at 50% 50%, rgba(112,86,255,.34), rgba(72,60,190,.10) 55%, transparent 72%);
  animation:drift-a 42s ease-in-out infinite;
}
.nebula--b{
  right:8%;top:26%;width:52%;height:52%;
  background:radial-gradient(circle at 50% 50%, rgba(40,170,255,.26), rgba(20,110,200,.08) 55%, transparent 74%);
  animation:drift-b 55s ease-in-out infinite;
}
.nebula--c{
  left:6%;bottom:-18%;width:48%;height:56%;
  background:radial-gradient(circle at 50% 50%, rgba(255,90,170,.20), rgba(150,40,140,.07) 55%, transparent 74%);
  animation:drift-a 64s ease-in-out infinite reverse;
}

@keyframes drift-a{
  0%,100%{transform:translate3d(0,0,0) scale(1);}
  50%{transform:translate3d(4%,3%,0) scale(1.12);}
}
@keyframes drift-b{
  0%,100%{transform:translate3d(0,0,0) scale(1.05);}
  50%{transform:translate3d(-5%,-4%,0) scale(.92);}
}

.orbit-line{
  position:absolute;
  left:-6%;top:44%;width:112%;height:34%;
  border-radius:50%;
  border-top:1px solid rgba(150,205,255,.16);
  transform:rotate(-7deg);
  pointer-events:none;
}
.orbit-sat{
  position:absolute;left:0;top:-3px;width:6px;height:6px;border-radius:50%;
  background:#dff8ff;
  box-shadow:0 0 10px rgba(160,230,255,.9), 0 0 24px rgba(120,200,255,.55);
  animation:sat-move 46s linear infinite;
}
.orbit-sat::after{
  content:"";position:absolute;left:-9px;top:2px;width:9px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(180,230,255,.7));
}
@keyframes sat-move{
  0%{left:2%;opacity:0;}
  8%{opacity:.9;}
  92%{opacity:.9;}
  100%{left:98%;opacity:0;}
}

/* ---------- 地球：NASA 卫星贴图 + 横向滚动模拟自转 ----------
   整个球体完整显示、屏幕正中间（类似 Google Earth 的全球视角）。
   贴图横向 2×球宽（360° 经度）、纵向 1×球高（南北纬 90°~-90°），
   background-position-x: -28.6% 让初始正对约东经 13°（非洲/大西洋）。 */
.earth{
  --globe:clamp(320px, 62vh, 760px);
  position:absolute;
  left:calc(50% - var(--globe) / 2);
  top:calc(50% - var(--globe) / 2);
  width:var(--globe);height:var(--globe);
  z-index:1;pointer-events:none;
}
.earth__ball{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:#061024;
}
.earth__tex,.earth__cloud{
  position:absolute;left:0;top:0;width:400%;height:100%;
  background-repeat:repeat-x;
  background-size:50% 100%;
  background-position:0% 0%;
  will-change:transform;
  animation:earthSlide 110s linear infinite;
}
.earth__tex{
  background-image:url('./assets/earth-map.jpg');
  background-position-x:-28.6%;
}
.earth__cloud{
  background-image:url('./assets/earth-clouds.png');
  background-position-x:-18%;
  opacity:.5;mix-blend-mode:screen;
  animation-duration:88s;
}
/* 一次滚动恰好等于一张贴图宽度，无缝循环 */
@keyframes earthSlide{
  from{transform:translate3d(0,0,0);}
  to{transform:translate3d(-50%,0,0);}
}
.earth__shade{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(115% 115% at 30% 24%, rgba(200,235,255,.20), transparent 48%),
    radial-gradient(140% 140% at 80% 84%, rgba(0,2,10,.72), transparent 58%);
  box-shadow:
    inset -14vh -12vh 26vh -6vh rgba(0,2,10,.85),
    inset 7vh 7vh 16vh -6vh rgba(150,215,255,.32),
    0 0 14vh rgba(60,150,255,.22);
}
.earth__atmo{
  position:absolute;inset:-3%;border-radius:50%;
  background:radial-gradient(circle, transparent 62%, rgba(130,205,255,.40) 71%, rgba(90,170,255,.14) 78%, transparent 88%);
  filter:blur(14px);
}

/* ---------- 机械科技风边框 ---------- */
.frame{position:absolute;inset:0;z-index:88;pointer-events:none;}

.frame__bar{
  position:absolute;display:block;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    0 0 26px rgba(0,0,0,.55);
}
/* 拉丝金属 + 分段拼板 */
.frame__bar::after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.055) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0 44px, transparent 44px 132px);
  opacity:.55;mix-blend-mode:overlay;
}
.frame__bar--t,.frame__bar--b{left:0;right:0;height:var(--fw);}
.frame__bar--t{top:0;
  background:linear-gradient(180deg,#5d687e 0%,#3a4459 18%,#232b3d 46%,#161c2a 74%,#0b1018 100%);}
.frame__bar--b{bottom:0;
  background:linear-gradient(0deg,#5d687e 0%,#3a4459 18%,#232b3d 46%,#161c2a 74%,#0b1018 100%);}
.frame__bar--l,.frame__bar--r{top:0;bottom:0;width:var(--fw);}
.frame__bar--l{left:0;
  background:linear-gradient(90deg,#566178 0%,#333d52 20%,#1e2534 54%,#101620 100%);}
.frame__bar--r{right:0;
  background:linear-gradient(270deg,#566178 0%,#333d52 20%,#1e2534 54%,#101620 100%);}

/* 内沿冷光 */
.frame__bar--t::before,.frame__bar--b::before{
  content:"";position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(120,200,255,.35) 18%,rgba(200,245,255,.55) 50%,rgba(120,200,255,.35) 82%,transparent);
  box-shadow:0 0 14px rgba(110,200,255,.4);
}
.frame__bar--t::before{bottom:0;}
.frame__bar--b::before{top:0;}
.frame__bar--l::before,.frame__bar--r::before{
  content:"";position:absolute;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,transparent,rgba(120,200,255,.30) 25%,rgba(200,245,255,.45) 50%,rgba(120,200,255,.30) 75%,transparent);
  box-shadow:0 0 14px rgba(110,200,255,.35);
}
.frame__bar--l::before{right:0;}
.frame__bar--r::before{left:0;}

.frame__inner{
  position:absolute;inset:var(--fw);border-radius:3px;
  box-shadow:
    inset 0 0 0 1px rgba(150,210,255,.18),
    inset 0 0 30px rgba(0,0,0,.6),
    inset 0 0 70px rgba(20,60,140,.16),
    inset 0 -8vh 18vh -8vh rgba(0,0,0,.5);
}

.frame__corner{
  position:absolute;width:calc(var(--fw) * 2.4);height:calc(var(--fw) * 2.4);
  border-radius:7px;
  background:linear-gradient(135deg,#6e7a94 0%,#3e4961 30%,#232b3d 64%,#121826 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.22),
    inset 0 0 20px rgba(0,0,0,.5),
    0 0 24px rgba(0,0,0,.6);
}
.frame__corner i{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#e2eaf5,#8d99ad 55%,#39414f 100%);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.6);
}
.frame__corner i:nth-child(1){left:20%;top:20%;}
.frame__corner i:nth-child(2){right:20%;bottom:20%;}
.frame__corner--tl{left:-1px;top:-1px;}
.frame__corner--tr{right:-1px;top:-1px;}
.frame__corner--bl{left:-1px;bottom:-1px;}
.frame__corner--br{right:-1px;bottom:-1px;}

.frame__leds{
  position:absolute;left:calc(var(--fw) + 14px);bottom:calc(var(--fw) * .26);
  display:flex;gap:7px;
}
.frame__leds i{
  width:5px;height:5px;border-radius:50%;background:#7fe9ff;
  box-shadow:0 0 10px rgba(127,233,255,.9);
  animation:ledpulse 2.6s ease-in-out infinite;
}
.frame__leds i:nth-child(2){background:#8df0c4;box-shadow:0 0 10px rgba(141,240,196,.9);animation-delay:.35s;}
.frame__leds i:nth-child(3){background:#ffca7a;box-shadow:0 0 10px rgba(255,202,122,.9);animation-delay:.7s;}
.frame__leds i:nth-child(4){animation-delay:1.05s;}
@keyframes ledpulse{0%,100%{opacity:.32;transform:scale(.8);}50%{opacity:1;transform:scale(1);}}

.titlebar{
  position:absolute;left:var(--fw);right:var(--fw);top:var(--fw);height:46px;z-index:90;
  display:flex;align-items:center;gap:14px;
  padding:0 16px;
  background:linear-gradient(180deg, rgba(12,19,34,.92), rgba(9,15,28,.68) 70%, rgba(9,15,28,0));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(140,195,255,.10);
}

.lights{display:flex;gap:8px;align-items:center;padding-right:4px;}
.light{width:11px;height:11px;border-radius:50%;display:block;box-shadow:inset 0 -1px 2px rgba(0,0,0,.35);}
.light--r{background:radial-gradient(circle at 35% 30%,#ff9a8c,#e5483c);}
.light--y{background:radial-gradient(circle at 35% 30%,#ffd98c,#e0a52c);}
.light--g{background:radial-gradient(circle at 35% 30%,#a8f0b6,#31a94d);}

.titlebar__title{display:flex;align-items:baseline;gap:10px;min-width:0;}
.titlebar__name{
  font-size:13px;font-weight:600;letter-spacing:.06em;
  text-shadow:0 0 14px rgba(130,215,255,.45);
}
.titlebar__sub{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.30em;
  color:rgba(170,205,240,.52);white-space:nowrap;
}

.titlebar__tools{margin-left:auto;display:flex;align-items:center;gap:8px;}
.live-pill{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.20em;
  padding:5px 10px;border-radius:999px;
  color:#ffd7dd;
  background:rgba(255,70,110,.10);
  box-shadow:inset 0 0 0 1px rgba(255,110,140,.30);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:#ff5f7e;
  box-shadow:0 0 10px rgba(255,95,126,.9);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);}}

.tool{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 11px;border-radius:9px;
  font-size:11.5px;letter-spacing:.04em;
  color:rgba(222,238,255,.86);
  background:rgba(140,195,255,.07);
  box-shadow:inset 0 0 0 1px rgba(150,200,255,.16);
  transition:background .18s ease, box-shadow .18s ease, transform .18s ease;
}
.tool svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tool svg .solid{fill:currentColor;stroke:none;}
.tool:hover{background:rgba(150,205,255,.16);box-shadow:inset 0 0 0 1px rgba(170,220,255,.34);}
.tool:active{transform:translateY(1px);}
.tool .slash{opacity:1;}
.tool[aria-pressed="true"]{color:#0a1526;background:linear-gradient(180deg,#a9f0ff,#63d3f5);box-shadow:0 0 20px rgba(120,220,255,.35);}
.tool[aria-pressed="true"] .slash{opacity:0;}

/* ---------- 左上 HUD ---------- */
.hud{
  position:absolute;left:calc(var(--fw) + 18px);top:calc(var(--fw) + 58px);z-index:60;
  display:flex;flex-direction:column;gap:11px;align-items:flex-start;
}
.hud__badge{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 13px;border-radius:999px;
  background:var(--glass);
  box-shadow:inset 0 0 0 1px rgba(150,200,255,.18), 0 8px 24px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.hud__badge b{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#c8f2ff;}
.hud__badge span{font-size:11px;color:var(--muted);letter-spacing:.06em;}
.hud__pulse{
  width:7px;height:7px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 10px rgba(141,240,196,.9);
  animation:pulse 2.4s ease-in-out infinite;
}
.hud__clocks{display:flex;gap:18px;padding-left:3px;}
.hud__clock{display:flex;flex-direction:column;gap:1px;}
.hud__clock span{
  font-family:var(--mono);font-size:22px;letter-spacing:.06em;
  color:#eaf7ff;text-shadow:0 0 18px rgba(120,205,255,.45);
}
.hud__clock small{font-size:9.5px;letter-spacing:.18em;color:var(--faint);font-family:var(--mono);}
.hud__note{
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;
  padding-left:3px;
}

/* ---------- 右上 圆环 ---------- */
.ring{
  position:absolute;top:calc(var(--fw) + 62px);right:calc(var(--fw) + 12px);z-index:40;
  width:min(1180px, 82vw);
  height:318px;
  outline:none;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  transform:scale(var(--ring-scale));
  transform-origin:100% 0;
}
.ring__stage{
  position:absolute;inset:0;
  perspective:2600px;
  perspective-origin:50% 0%;
  transform-style:preserve-3d;
}

.card{
  position:absolute;left:50%;top:0;
  width:178px;height:128px;
  margin:-64px 0 0 -89px;
  border-radius:15px;
  overflow:hidden;
  background:#0a1220;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.15),
    0 20px 44px rgba(0,0,0,.55);
  cursor:pointer;
  will-change:transform,opacity;
  transition:box-shadow .3s ease;
  -webkit-user-select:none;user-select:none;
}
.card__bg,.card__bg svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* 版块图片：加载成功后淡入，失败则露出底层矢量插画 */
.card__photo{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:center;
  opacity:0;transform:scale(1.06);
  transition:opacity .7s ease, transform 1.2s cubic-bezier(.2,.8,.3,1);
  will-change:opacity,transform;
}
.card__photo.is-ready{opacity:1;transform:scale(1);}
.card.is-active .card__photo.is-ready{animation:kenburns 24s ease-in-out infinite alternate;}
@keyframes kenburns{from{transform:scale(1.02);}to{transform:scale(1.14);}}
.card__tint{
  position:absolute;inset:0;opacity:.16;mix-blend-mode:soft-light;pointer-events:none;
}
.card__shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(4,9,20,.26) 0%, rgba(4,9,20,.32) 36%,
    rgba(3,8,18,.82) 76%, rgba(2,6,14,.96) 100%);
}
.card__glow{
  position:absolute;inset:0;opacity:0;
  background:radial-gradient(70% 60% at 50% 100%, rgba(140,220,255,.30), transparent 70%);
  transition:opacity .35s ease;
}
.card__text{position:absolute;left:13px;right:12px;bottom:10px;}
.card__text h3{
  margin:0;font-size:16.5px;font-weight:600;letter-spacing:.06em;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.75), 0 0 22px rgba(0,0,0,.5);
}
.card__text p{
  margin:3px 0 0;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;
  color:rgba(255,255,255,.66);
}
.card__idx{
  position:absolute;right:11px;top:9px;
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  color:rgba(255,255,255,.55);
}
.card__dot{
  position:absolute;left:13px;top:11px;width:7px;height:7px;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.card.is-active{
  box-shadow:
    inset 0 0 0 1.5px rgba(190,240,255,.75),
    0 0 0 1px rgba(120,210,255,.35),
    0 26px 60px rgba(0,0,0,.6),
    0 0 46px rgba(110,205,255,.35);
}
.card.is-active .card__glow{opacity:1;}
.card.is-active .card__tag{opacity:1;transform:translateY(0);}
.card__tag{
  position:absolute;right:10px;bottom:10px;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  padding:3px 7px;border-radius:999px;color:#08131f;
  background:linear-gradient(180deg,#b7f2ff,#6fd8f6);
  opacity:0;transform:translateY(4px);
  transition:opacity .3s ease, transform .3s ease;
}
.card.is-active .card__text{bottom:12px;}

.ring__foot{
  position:absolute;right:2px;bottom:-4px;
  display:flex;align-items:center;gap:14px;
}
.ring__hint{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  color:rgba(180,210,240,.42);
}
.ring__dots{display:flex;gap:5px;align-items:center;}
.ring__dots i{
  width:5px;height:5px;border-radius:50%;background:rgba(160,205,240,.30);
  transition:background .25s ease, transform .25s ease, box-shadow .25s ease;
}
.ring__dots i.on{background:#a7ecff;transform:scale(1.5);box-shadow:0 0 10px rgba(140,225,255,.85);}
.ring__play{
  display:inline-flex;align-items:center;gap:7px;
  height:32px;padding:0 14px 0 11px;border-radius:999px;
  font-size:12px;letter-spacing:.08em;color:#06131f;font-weight:600;
  background:linear-gradient(180deg,#c6f4ff,#74dcf7);
  box-shadow:0 0 24px rgba(110,215,255,.45), inset 0 0 0 1px rgba(255,255,255,.6);
  transition:transform .18s ease, box-shadow .18s ease;
}
.ring__play svg{width:15px;height:15px;fill:currentColor;}
.ring__play:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(120,225,255,.6), inset 0 0 0 1px rgba(255,255,255,.7);}
.ring__play:active{transform:translateY(1px);}

/* ---------- 机器人（本地图片 + 脚部浮空装置） ---------- */
.robot{
  position:absolute;
  left:calc(var(--fw) + clamp(10px, 4.4vw, 100px));
  bottom:calc(var(--fw) + 92px);
  width:clamp(150px, 14vw, 214px);
  z-index:46;
}

/* 整体上下浮动 */
.robot__float{animation:bob 6.5s ease-in-out infinite;}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-.5deg);}
  50%{transform:translateY(-14px) rotate(.6deg);}
}

/* 机器人本体：透明背景 PNG，无需再遮罩 */
.bot{position:relative;margin:0;aspect-ratio:1251 / 1741;}

.bot__photo{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:contain;
  filter:drop-shadow(0 26px 32px rgba(0,0,0,.5)) saturate(1.05) contrast(1.02);
}

/* 脚部浮空装置：光晕呼吸 */
.bot__halo{
  position:absolute;left:42.3%;top:83%;width:46%;height:11%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at 50% 50%,
    rgba(198,246,255,.9), rgba(96,205,255,.5) 42%, rgba(60,150,255,0) 72%);
  filter:blur(7px);
  mix-blend-mode:screen;
  animation:halo 2.6s ease-in-out infinite;
}
@keyframes halo{
  0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.94);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
}

/* 脚部浮空装置：向下扩散的气环 */
.bot__ripple{
  position:absolute;left:42.3%;top:83%;width:34%;height:7.5%;
  border-radius:50%;
  border:1.5px solid rgba(160,235,255,.7);
  box-shadow:0 0 18px rgba(120,220,255,.55), inset 0 0 14px rgba(120,220,255,.32);
  transform:translate(-50%,-50%);
  animation:ripple 3.6s ease-out infinite;
  pointer-events:none;
}
.bot__ripple--2{animation-delay:1.8s;}
@keyframes ripple{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55);}
  16%{opacity:.85;}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1.75);}
}

/* 向下喷出的光柱 */
.bot__beam{
  position:absolute;left:42.3%;top:87%;width:70%;height:20%;
  transform:translateX(-50%);
  background:linear-gradient(180deg,
    rgba(160,235,255,.45), rgba(90,190,255,.16) 48%, rgba(70,150,255,0) 100%);
  clip-path:polygon(41% 0, 59% 0, 86% 100%, 14% 100%);
  filter:blur(6px);
  mix-blend-mode:screen;
  animation:beam 3s ease-in-out infinite;
}
@keyframes beam{0%,100%{opacity:.55;}50%{opacity:1;}}

/* 装置周围上浮的微粒 */
.bot__sparks{position:absolute;left:42.3%;top:79%;width:66%;height:24%;transform:translateX(-50%);pointer-events:none;}
.bot__sparks i{
  position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;
  background:rgba(190,245,255,.9);
  box-shadow:0 0 8px rgba(150,230,255,.9);
  animation:spark 4s ease-in-out infinite;
}
.bot__sparks i:nth-child(1){left:10%;animation-delay:0s;}
.bot__sparks i:nth-child(2){left:22%;animation-delay:.6s;}
.bot__sparks i:nth-child(3){left:35%;animation-delay:1.3s;}
.bot__sparks i:nth-child(4){left:47%;animation-delay:.3s;}
.bot__sparks i:nth-child(5){left:59%;animation-delay:1.7s;}
.bot__sparks i:nth-child(6){left:70%;animation-delay:.9s;}
.bot__sparks i:nth-child(7){left:82%;animation-delay:2.1s;}
.bot__sparks i:nth-child(8){left:92%;animation-delay:1.5s;}
@keyframes spark{
  0%{transform:translateY(0) scale(.5);opacity:0;}
  22%{opacity:1;}
  100%{transform:translateY(-72px) scale(1);opacity:0;}
}

/* 装置打在桌面上的光斑 */
.bot__pool{
  position:absolute;left:42.3%;bottom:-7%;width:130%;height:9%;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 50%,
    rgba(160,238,255,.42), rgba(90,180,255,.14) 55%, transparent 78%);
  filter:blur(9px);
  animation:poolpulse 3.6s ease-in-out infinite;
}
@keyframes poolpulse{
  0%,100%{opacity:.45;transform:translateX(-50%) scaleX(.9);}
  50%{opacity:.88;transform:translateX(-50%) scaleX(1.06);}
}

.robot:hover .bot__halo{animation-duration:1.8s;}
.robot:hover .bot__pool{animation-duration:2s;}

/* 播报时浮空装置加速、整体更亮 */
.robot.is-speaking .bot__halo{animation-duration:1.25s;}
.robot.is-speaking .bot__beam{animation-duration:1.4s;}
.robot.is-speaking .bot__pool{animation-duration:1.8s;}
.robot.is-speaking .bot__photo{
  filter:drop-shadow(0 24px 30px rgba(0,0,0,.55)) saturate(1.12) contrast(1.04) brightness(1.06);
}

/* 全息播报面板 */
.holo{
  position:absolute;left:calc(100% + 6px);bottom:6%;
  width:min(310px, 42vw);
  pointer-events:none;
  padding:13px 15px 12px;
  border-radius:14px;
  background:linear-gradient(180deg, rgba(18,44,72,.72), rgba(9,22,40,.66));
  box-shadow:
    inset 0 0 0 1px rgba(140,225,255,.32),
    0 18px 46px rgba(0,0,0,.5),
    0 0 40px rgba(70,170,255,.16);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  overflow:hidden;
  transition:transform .35s ease, box-shadow .35s ease;
}
.holo::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:38px;
  background:linear-gradient(90deg, rgba(120,220,255,.10), transparent);
  pointer-events:none;
}
.robot.is-speaking .holo{
  box-shadow:
    inset 0 0 0 1px rgba(160,235,255,.55),
    0 18px 46px rgba(0,0,0,.5),
    0 0 56px rgba(80,190,255,.30);
  transform:translateY(-3px);
}
.holo__head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.holo__dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px rgba(140,235,255,.9);}
.holo__cat{font-size:11.5px;letter-spacing:.14em;color:#cdf3ff;}
.holo__tag{
  margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
  padding:2px 7px;border-radius:999px;color:#a9f0d3;
  background:rgba(141,240,196,.10);box-shadow:inset 0 0 0 1px rgba(141,240,196,.28);
}
.holo__line{
  margin:0;font-size:13px;line-height:1.62;letter-spacing:.02em;
  color:#eaf8ff;min-height:2.6em;
  text-shadow:0 0 18px rgba(120,205,255,.28);
}
.holo__line .cursor{
  display:inline-block;width:7px;height:13px;margin-left:2px;
  background:var(--cyan);vertical-align:-2px;
  animation:pulse .7s steps(2) infinite;
}
.holo__meta{
  margin-top:7px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  color:rgba(170,210,240,.5);
}
.holo__wave{display:flex;align-items:flex-end;gap:2.5px;height:16px;margin-top:9px;opacity:.35;}
.holo__wave i{
  width:3px;height:4px;border-radius:2px;background:linear-gradient(180deg,#a9f0ff,#4fb6e8);
  transition:height .2s ease;
}
.robot.is-speaking .holo__wave{opacity:.95;}
.robot.is-speaking .holo__wave i{animation:wave .7s ease-in-out infinite;}
.robot.is-speaking .holo__wave i:nth-child(2n){animation-duration:.58s;}
.robot.is-speaking .holo__wave i:nth-child(3n){animation-duration:.86s;}
.robot.is-speaking .holo__wave i:nth-child(4n){animation-duration:.46s;}
@keyframes wave{0%,100%{height:4px;}50%{height:16px;}}
.holo__scan{
  position:absolute;left:0;right:0;height:34px;top:-40px;
  background:linear-gradient(180deg, transparent, rgba(140,230,255,.16), transparent);
  animation:holoscan 4.4s linear infinite;
}
@keyframes holoscan{0%{top:-40px;}100%{top:110%;}}

/* ---------- 边框底边右侧：浇水壶 + 玻璃罐 ---------- */
.shelf{
  position:absolute;
  right:calc(var(--fw) + clamp(18px, 5.5vw, 110px));
  bottom:calc(var(--fw) + 4px);
  display:flex;align-items:flex-end;
  gap:clamp(6px, 1.2vw, 20px);
  z-index:47;
}

/* assets 里有图就显示图片，没有就显示内置矢量图 */
.prop__photo{
  display:none;width:100%;height:auto;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.6));
}
.can.has-photo .prop__photo,.jar.has-photo .prop__photo{display:block;}
.can.has-photo .can__art,.jar.has-photo .jar__art{display:none;}

.can{
  position:relative;
  width:var(--can-w);
  transform-origin:78% 92%;
  transition:transform .35s cubic-bezier(.2,.8,.3,1.2), filter .3s ease;
  filter:drop-shadow(0 18px 20px rgba(0,0,0,.5));
}
.can:hover{transform:translateY(-5px) rotate(3deg);}
.can.is-pouring{animation:pour 1.4s ease-in-out;}
@keyframes pour{
  0%{transform:translate(0,0) rotate(0deg);}
  18%{transform:translate(6px, calc(-1 * var(--pour-lift, 60px))) rotate(18deg);}
  62%{transform:translate(6px, calc(-1 * var(--pour-lift, 60px))) rotate(18deg);}
  84%{transform:translate(2px, calc(-0.42 * var(--pour-lift, 60px))) rotate(8deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
.can__art{width:100%;height:auto;display:block;}

.jar{
  position:relative;
  width:var(--jar-w);
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
.jar__art{width:100%;height:auto;display:block;}
.jar__tag{
  position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  white-space:nowrap;
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  padding:4px 9px;border-radius:999px;
  color:#bff0d8;background:rgba(12,32,26,.72);
  box-shadow:inset 0 0 0 1px rgba(141,240,196,.28);
  opacity:0;transition:opacity .3s ease, transform .3s ease;
}
.jar:hover .jar__tag,.jar.show-tag .jar__tag{opacity:1;transform:translateX(-50%) translateY(-2px);}

.jr-plant{transition:transform .8s cubic-bezier(.2,.8,.3,1.1);transform-origin:100px 214px;}
.jr-leaf-new{opacity:.25;transform-origin:100px 158px;transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.3,1.2);}
.jar__art[data-stage="1"] .jr-leaf-new{opacity:.7;transform:scale(.85);}
.jar__art[data-stage="2"] .jr-leaf-new{opacity:1;transform:scale(1.05);}
.jar__art[data-stage="3"] .jr-leaf-new{opacity:1;transform:scale(1.25) translateY(-4px);}
.jar__art[data-stage="1"] .jr-plant{transform:scale(1.02);}
.jar__art[data-stage="2"] .jr-plant{transform:scale(1.05);}
.jar__art[data-stage="3"] .jr-plant{transform:scale(1.09);}
.jr-water{transition:y .5s ease, height .5s ease, opacity .5s ease;}
.jr-sparkles{transition:opacity .4s ease;}
.jar.is-watering .jr-sparkles{opacity:1;animation:sparklepop 1.2s ease-out;}
@keyframes sparklepop{0%{opacity:0;transform:translateY(6px) scale(.7);}35%{opacity:1;}100%{opacity:0;transform:translateY(-10px) scale(1.15);}}

/* 水滴层 */
.water-layer{position:absolute;inset:0;z-index:70;pointer-events:none;overflow:hidden;}
.drop{
  position:absolute;border-radius:50% 50% 60% 60%;
  background:linear-gradient(180deg, rgba(210,245,255,.95), rgba(110,200,240,.7));
  box-shadow:0 0 8px rgba(150,225,255,.7);
}
.splash{
  position:absolute;width:6px;height:6px;border-radius:50%;
  border:1px solid rgba(170,235,255,.8);
  animation:splashout .65s ease-out forwards;
}
@keyframes splashout{to{transform:scale(3.4);opacity:0;}}

/* ---------- 提示条 ---------- */
.toast{
  position:absolute;left:50%;bottom:calc(var(--fw) + 118px);
  transform:translate(-50%, 12px);
  z-index:75;pointer-events:none;
  padding:9px 16px;border-radius:999px;
  font-size:12px;letter-spacing:.05em;color:#dff4ff;
  background:rgba(10,20,36,.78);
  box-shadow:inset 0 0 0 1px rgba(150,205,255,.22), 0 14px 34px rgba(0,0,0,.5);
  backdrop-filter:blur(10px);
  opacity:0;transition:opacity .35s ease, transform .35s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 自适应 ---------- */
@media (max-width:1500px){
  :root{--ring-scale:.92;}
  .ring{width:min(1120px, 84vw);}
}
@media (max-width:1180px){
  :root{--ring-scale:.80;}
  .ring{width:96vw;right:2vw;}
  .holo{width:min(260px,38vw);}
}
@media (max-width:900px){
  :root{--ring-scale:.66;}
  .ring{top:calc(var(--fw) + 52px);width:104vw;right:-4vw;}
  .hud{left:16px;top:calc(var(--fw) + 52px);gap:8px;}
  .hud__clock span{font-size:18px;}
  .robot{width:clamp(120px,22vw,170px);left:4vw;bottom:calc(var(--fw) + 50px);}
  .holo{width:min(232px,52vw);left:auto;right:96%;bottom:100%;}
  .titlebar__sub{display:none;}
}
@media (max-width:640px){
  :root{--ring-scale:.52;}
  .ring{top:calc(var(--fw) + 48px);width:132vw;right:-16vw;}
  .card{width:158px;height:114px;margin:-57px 0 0 -79px;}
  .card__text h3{font-size:14.5px;}
  .hud__clocks{display:none;}
  .shelf{right:calc(var(--fw) + 12px);bottom:calc(var(--fw) + 2px);}
  .live-pill{display:none;}
  .holo{bottom:auto;top:100%;right:auto;left:0;width:min(230px,64vw);}
}

/* ---------- 动效偏好 ---------- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.12s !important;}
}

</style>

        </defs>
        <ellipse cx="112" cy="156" rx="56" ry="11" fill="#02060d" opacity=".55"/>

  function cardArt(cat) {
    return `<svg viewBox="0 0 178 128" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${ART[cat.k](cat)}</svg>`;
  }

  /* ---------------------------------------------------------
     三、星空
     --------------------------------------------------------- */
  const canvas = $('#starfield');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let stars = [], shots = [];

  function resizeStars() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const n = Math.round(W * H / 8600);
    stars = Array.from({ length: n }, () => {
      const warm = Math.random();
      return {
        x: Math.random() * W,
        y: Math.random() * H * 0.94,
        r: Math.random() * 1.25 + 0.28,
        a: Math.random() * 0.62 + 0.28,
        tw: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.022 + 0.004,
        c: warm > 0.9 ? '255,222,180' : warm > 0.74 ? '180,232,255' : '255,255,255'
      };
    });
  }

  function drawStars(t) {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.tw += s.sp;
      const tw = 0.62 + 0.38 * Math.sin(s.tw);
      const a = s.a * tw;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.c},${a.toFixed(3)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1.15) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(${s.c},${(a * 0.14).toFixed(3)})`;
        ctx.arc(s.x, s.y, s.r * 4.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // 流星
    if (Math.random() < 0.0022 && shots.length < 2) {
      shots.push({
        x: Math.random() * W * 0.7 + W * 0.25,
        y: Math.random() * H * 0.36,
        vx: -(3.4 + Math.random() * 2.4),
        vy: 1.7 + Math.random() * 1.2,
        life: 1
      });
    }
    for (let i = shots.length - 1; i >= 0; i--) {
      const m = shots[i];
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      if (m.life <= 0) { shots.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 16, m.y - m.vy * 16);
      g.addColorStop(0, `rgba(230,248,255,${(0.85 * m.life).toFixed(3)})`);
      g.addColorStop(1, 'rgba(230,248,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 16, m.y - m.vy * 16);
      ctx.stroke();
    }
  }

  /* ---------------------------------------------------------
     四、圆环新闻版块
     --------------------------------------------------------- */
  const stage = $('#ringStage');
  const dotsWrap = $('#ringDots');
  const N = CATS.length;
  const R = 460;          // 圆环半径
  const STEP = 20;        // 每格角度
  const MAXA = 68;        // 可见角度上限
  const TILT = 0.28;      // 俯视倾斜
  const ROT = 0.72;       // 卡片切向旋转比例

  let offset = 0, target = 0, velocity = 0, dragging = false, lastX = 0, moved = 0;
  let lastInteract = Date.now();
  let ringDirty = true;

  const attr = (v) => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;');

  const cards = CATS.map((cat, i) => {
    const el = document.createElement('article');
    el.className = 'card';
    el.dataset.i = String(i);
    el.innerHTML =
      `<div class="card__bg">` +
        `${cardArt(cat)}` +
        `<img class="card__photo" src="${attr(cat.img)}" alt="" referrerpolicy="no-referrer" decoding="async">` +
      `</div>` +
      `<div class="card__tint" style="background:${cat.accent}"></div>` +
      `<div class="card__shade"></div>` +
      `<div class="card__glow"></div>` +
      `<span class="card__dot" style="color:${cat.accent};background:${cat.accent}"></span>` +
      `<span class="card__idx">${String(i + 1).padStart(2, '0')}</span>` +
      `<div class="card__text"><h3>${cat.name}</h3><p>${cat.en}</p></div>` +
      `<span class="card__tag">当前版块</span>`;
    // 图片加载成功后淡入；若被图床拦截或断网，则移除图片，露出底层的矢量插画
    const photo = el.querySelector('.card__photo');
    if (photo) {
      const onOk = () => photo.classList.add('is-ready');
      const onBad = () => photo.remove();
      photo.addEventListener('load', onOk);
      photo.addEventListener('error', onBad);
      if (photo.complete && photo.naturalWidth > 0) onOk();
    }
    el.addEventListener('click', () => {
      if (moved > 6) return;
      const u = shortestU(i);
      if (Math.abs(u) < 0.5) { play(cat); }
      else { target = offset + u; lastInteract = Date.now(); ringDirty = true; }
    });
    stage.appendChild(el);
    return el;
  });

  const dots = CATS.map(() => {
    const d = document.createElement('i');
    dotsWrap.appendChild(d);
    return d;
  });

  function shortestU(i) {
    let u = (((i - offset) % N) + N) % N;
    if (u > N / 2) u -= N;
    return u;
  }

  function updateRing() {
    for (let i = 0; i < N; i++) {
      const el = cards[i];
      let u = (((i - offset) % N) + N) % N;
      if (u > N / 2) u -= N;
      const th = u * STEP;
      const rad = th * Math.PI / 180;
      const x = R * Math.sin(rad);
      const z = R * Math.cos(rad);
      const y = TILT * z;
      const abs = Math.abs(th);
      const t = clamp((abs - 50) / (MAXA - 50), 0, 1);
      const op = abs > MAXA ? 0 : 1 - t * 0.86;
      el.style.transform =
        `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateY(${(th * ROT).toFixed(2)}deg)`;
      el.style.opacity = op.toFixed(3);
      el.style.zIndex = String(Math.round(2000 - z));
      el.style.pointerEvents = op < 0.25 ? 'none' : 'auto';
      el.classList.toggle('is-active', Math.abs(u) < 0.5);
    }
    const active = ((Math.round(offset) % N) + N) % N;
    dots.forEach((d, i) => d.classList.toggle('on', i === active));
    if (active !== updateRing.lastActive) {
      updateRing.lastActive = active;
      previewCategory(CATS[active]);
    }
  }

  // 拖动 / 滚轮 / 键盘
  const ring = $('#ring');
  ring.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.ring__play')) return;
    dragging = true; moved = 0; lastX = e.clientX; velocity = 0;
    ring.setPointerCapture(e.pointerId);
    ring.style.cursor = 'grabbing';
  });
  ring.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    moved += Math.abs(dx);
    const d = -dx / 150;
    offset += d; target = offset;
    velocity = d;
    lastInteract = Date.now();
    ringDirty = true;
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    ring.style.cursor = '';
    target = Math.round(offset + clamp(velocity * 9, -2.4, 2.4));
    velocity = 0;
    lastInteract = Date.now();
    ringDirty = true;
  }
  ring.addEventListener('pointerup', endDrag);
  ring.addEventListener('pointercancel', endDrag);
  let wheelTimer = 0;
  ring.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / 300;
    target += clamp(d, -1.4, 1.4);
    lastInteract = Date.now();
    ringDirty = true;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => {
      target = Math.round(target);
      lastInteract = Date.now();
      ringDirty = true;
    }, 200);
  }, { passive: false });
  ring.tabIndex = 0;
  ring.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { target = Math.round(target) + 1; lastInteract = Date.now(); }
    if (e.key === 'ArrowLeft') { target = Math.round(target) - 1; lastInteract = Date.now(); }
    if (e.key === 'Enter') play(CATS[((Math.round(offset) % N) + N) % N]);
  });

  /* ---------------------------------------------------------
     五、机器人播报
     --------------------------------------------------------- */
  const robot = $('#robot');
  const holoCat = $('#holoCat');
  const holoLine = $('#holoLine');
  const holoMeta = $('#holoMeta');
  const holoTag = $('#holoTag');

  // 机器人图片：默认 ./assets/podcast-bot.png；
  // 若页面被单独放在别的目录，第一次加载失败时自动换一条常见路径再试
  const botPhoto = $('.bot__photo');
  if (botPhoto) {
    botPhoto.addEventListener('error', () => {
      const alt = './orbital-news-pod/assets/podcast-bot.png';
      if (botPhoto.dataset.retried || botPhoto.getAttribute('src') === alt) return;
      botPhoto.dataset.retried = '1';
      botPhoto.src = alt;
    });
  }

  // 浇水壶 / 小植株：优先用 assets 里的图片，找不到就自动退回内置矢量图
  const PROP_FILES = {
    canPhoto: ['shuihu-cut.png', 'shuihu-cut.jpg', 'shuihu.png', 'shuihu.jpg', 'shuihu.jpeg', 'shuihu.webp', 'shuihu.jpd'],
    jarPhoto: ['zhizhu-cut.png', 'zhizhu-cut.jpg', 'zhizhu.png', 'zhizhu.jpg', 'zhizhu.jpeg', 'zhizhu.webp', 'zhizhu.jpd']
  };
  Object.keys(PROP_FILES).forEach((id) => {
    const img = $('#' + id);
    if (!img) return;
    const wrap = img.closest ? img.closest('.can, .jar') : null;
    const files = PROP_FILES[id];
    let i = 0;
    const tryNext = () => {
      if (i >= files.length) { if (img.remove) img.remove(); return; }
      img.src = './assets/' + files[i++];
    };
    img.addEventListener('load', () => { if (wrap && wrap.classList) wrap.classList.add('has-photo'); });
    img.addEventListener('error', tryNext);
    tryNext();
  });

  let speakId = 0;
  let speaking = false;

  function resetTags() {
    cards.forEach((c) => { $('.card__tag', c).textContent = '当前版块'; });
  }

  function typeLine(text, speed) {
    const myId = speakId;
    holoLine.textContent = '';
    return new Promise((resolve) => {
      let i = 0;
      const tick = () => {
        if (myId !== speakId) return resolve(false);
        holoLine.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(tick, speed || 34);
        else resolve(true);
      };
      tick();
    });
  }

  function previewCategory(cat) {
    if (speaking) return;
    holoCat.textContent = cat.name;
    holoTag.textContent = 'READY';
    holoLine.textContent = `${cat.name}：${cat.items[0].t}`;
    holoMeta.textContent = '点击中央卡片或“播报”开始';
  }

  async function play(cat) {
    speakId++;
    const myId = speakId;
    resetTags();
    const idx = CATS.indexOf(cat);
    const liveTag = idx >= 0 ? $('.card__tag', cards[idx]) : null;
    if (liveTag) liveTag.textContent = '正在播报';
    speaking = true;
    robot.classList.add('is-speaking');
    holoCat.textContent = cat.name;
    holoTag.textContent = 'ON AIR';
    sfxTune();

    const seq = cat.items.map((it) => ({ ...it, quip: false }))
      .concat([{ t: cat.quip, s: '播报员附言 · 私人频道', quip: true }]);

    for (const item of seq) {
      if (myId !== speakId) return;
      const ok = await typeLine(item.t, item.quip ? 40 : 30);
      if (!ok || myId !== speakId) return;
      holoMeta.textContent = item.s;
      sfxBlip(item.quip);
      await sleep(item.quip ? 3400 : 2300);
    }
    if (myId !== speakId) return;
    speaking = false;
    if (liveTag) liveTag.textContent = '当前版块';
    robot.classList.remove('is-speaking');
    holoTag.textContent = 'STANDBY';
    holoMeta.textContent = '播报结束 · 下一段等待唤醒';
  }

  $('#playBtn').addEventListener('click', () => {
    play(CATS[((Math.round(offset) % N) + N) % N]);
  });

  const jar = $('#jar');
  const jarArt = $('#jarArt');
  const jarTag = $('#jarTag');
  const can = $('#can');
  const waterLayer = $('#waterLayer');
  const toastEl = $('#toast');

  let moisture = 42;
  let stage_ = 0;
  let watering = false;
  let toastTimer = 0;

  const WATER_LINES = [
    '补水完成。你看，它把叶子抬起来了——这是植物的“谢谢”。',
    '长得不错。要我说，这株小苗比大多数实习生都稳定。',
    '已经完全喝饱了。再多就要被淹——关心也要有分寸，对人也一样。'
  ];

  function setWater() {
    const h = 26 + moisture * 0.42;
    const rect = $('.jr-water', jarArt);
    rect.setAttribute('height', h.toFixed(1));
    rect.setAttribute('y', (256 - h).toFixed(1));
    rect.setAttribute('opacity', moisture > 50 ? '0.95' : '0.55');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function dropFly(fromX, fromY, toX, toY, delay) {
    const d = document.createElement('span');
    d.className = 'drop';
    const size = 5 + Math.random() * 5;
    d.style.width = size + 'px';
    d.style.height = (size * 1.35) + 'px';
    d.style.left = fromX + 'px';
    d.style.top = fromY + 'px';
    waterLayer.appendChild(d);
    const midX = fromX + (toX - fromX) * 0.55 + (Math.random() * 18 - 9);
    const midY = fromY + (toY - fromY) * 0.45;
    const anim = d.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0 },
      { transform: `translate(${midX - fromX}px,${midY - fromY}px) scale(1)`, opacity: 1, offset: 0.45 },
      { transform: `translate(${toX - fromX}px,${toY - fromY}px) scale(.8)`, opacity: 1 }
    ], { duration: 620 + Math.random() * 160, delay, easing: 'cubic-bezier(.4,.1,.7,1)', fill: 'forwards' });
    anim.onfinish = () => {
      d.remove();
      const s = document.createElement('span');
      s.className = 'splash';
      s.style.left = toX + 'px';
      s.style.top = toY + 'px';
      waterLayer.appendChild(s);
      setTimeout(() => s.remove(), 700);
    };
  }

  function water() {
    if (watering) return;
    watering = true;
    lastInteract = Date.now();
    // 抬升高度：让水壶大约有一半壶身高出植株顶部
    // offsetHeight 不受 transform 影响，取的是真实布局高度
    const canH = can.offsetHeight || can.getBoundingClientRect().height;
    const jarH = jar.offsetHeight || jar.getBoundingClientRect().height;
    const lift = Math.max(24, jarH - canH * 0.5);
    can.style.setProperty('--pour-lift', lift.toFixed(1) + 'px');
    can.classList.add('is-pouring');
    jar.classList.add('is-watering');
    sfxWater();

    // 等壶身抬起、向右倾倒到位后再取点：
    // getBoundingClientRect 会带上 transform，所以拿到的是倾斜后的真实位置
    setTimeout(() => {
      const canRect = can.getBoundingClientRect();
      const jr = jar.getBoundingClientRect();
      const appRect = $('#app').getBoundingClientRect();
      const fromX = canRect.left + canRect.width * 0.80 - appRect.left;
      const fromY = canRect.top + canRect.height * 0.10 - appRect.top;
      const toX = jr.left + jr.width * 0.5 - appRect.left;
      const toY = jr.top + jr.height * 0.62 - appRect.top;
      for (let i = 0; i < 9; i++) {
        dropFly(fromX, fromY, toX + (Math.random() * 18 - 9), toY, i * 85);
      }
    }, 200);

    setTimeout(() => {
      moisture = clamp(moisture + 18, 0, 96);
      const newStage = clamp(Math.round((moisture - 42) / 18), 0, 3);
      const grew = newStage > stage_;
      stage_ = newStage;
      jarArt.dataset.stage = String(stage_);
      setWater();
      jarTag.textContent = `小苗 · 湿润度 ${moisture}%`;
      jar.classList.add('show-tag');
      setTimeout(() => jar.classList.remove('show-tag'), 3600);
      toast(grew ? `小苗长高了一点 · 湿润度 ${moisture}%` : `土壤湿润度 ${moisture}%`);

      // 让机器人说一句
      const line = moisture >= 96 ? WATER_LINES[2] : WATER_LINES[clamp(stage_ - 1, 0, 2)];
      speakId++;
      resetTags();
      const myId = speakId;
      speaking = true;
      robot.classList.add('is-speaking');
      holoCat.textContent = '生活贴士';
      holoTag.textContent = 'ON AIR';
      typeLine(line, 42).then((ok) => {
        if (!ok || myId !== speakId) return;
        holoMeta.textContent = '播报员附言 · 私人频道';
        setTimeout(() => {
          if (myId !== speakId) return;
          speaking = false;
          robot.classList.remove('is-speaking');
          holoTag.textContent = 'STANDBY';
        }, 2800);
      });
    }, 950);

    setTimeout(() => {
      can.classList.remove('is-pouring');
      jar.classList.remove('is-watering');
      watering = false;
    }, 1500);
  }

  can.addEventListener('click', water);
  jar.addEventListener('click', water);

  /* ---------------------------------------------------------
     七、音效（默认关闭）
     --------------------------------------------------------- */
  const soundBtn = $('#soundBtn');
  const soundLabel = $('#soundLabel');
  let soundOn = false;
  let actx = null;

  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function tone(freq, dur, type, gain, delay) {
    if (!soundOn) return;
    const ac = audio(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.04);
  }

  function noiseBurst(dur, from, to, gain) {
    if (!soundOn) return;
    const ac = audio(); if (!ac) return;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(from, ac.currentTime);
    bp.frequency.exponentialRampToValueAtTime(to, ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(gain || 0.16, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);
    src.start();
  }

  function sfxBlip(deep) {
    if (!soundOn) return;
    tone(deep ? 520 : 880, 0.09, 'triangle', 0.05, 0);
    tone(deep ? 780 : 1320, 0.07, 'triangle', 0.035, 0.07);
  }
  function sfxTune() {
    [660, 880, 1180].forEach((f, i) => tone(f, 0.08, 'square', 0.028, i * 0.09));
  }
  function sfxWater() {
    noiseBurst(1.25, 2400, 700, 0.14);
    tone(300, 0.5, 'sine', 0.02, 0.1);
  }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundLabel.textContent = soundOn ? '静音' : '音效';
    if (soundOn) { audio(); sfxBlip(); toast('播报音效已开启'); }
    else toast('播报音效已关闭');
  });

  /* ---------------------------------------------------------
     八、全屏 & 时钟
     --------------------------------------------------------- */
  $('#fsBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

  const clockUTC = $('#clockUTC');
  const clockLocal = $('#clockLocal');
  const dateLocal = $('#dateLocal');
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function tickClock() {
    const now = new Date();
    const p = (n) => String(n).padStart(2, '0');
    clockUTC.textContent = `${p(now.getUTCHours())}:${p(now.getUTCMinutes())}`;
    clockLocal.textContent = `${p(now.getHours())}:${p(now.getMinutes())}`;
    dateLocal.textContent = `${now.getMonth() + 1}月${now.getDate()}日 ${WEEK[now.getDay()]}`;
  }
  tickClock();
  setInterval(tickClock, 10000);

  /* ---------------------------------------------------------
     九、主循环
     --------------------------------------------------------- */
  let prev = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - prev) / 1000);
    prev = t;

    drawStars(t);

    // 阻尼跟随 + 吸附
    const d = target - offset;
    if (Math.abs(d) > 0.0015) {
      offset += d * Math.min(1, dt * 7.5);
      ringDirty = true;
    } else if (Math.abs(d) > 0) {
      offset = target;
      ringDirty = true;
    }
    if (ringDirty) { updateRing(); ringDirty = false; }

    // 空闲轮巡
    if (!dragging && !speaking && Date.now() - lastInteract > 14000) {
      target = Math.round(target) + 1;
      lastInteract = Date.now() - 4000;
      ringDirty = true;
    }

    requestAnimationFrame(loop);
  }

  /* ---------------------------------------------------------
     十、启动
     --------------------------------------------------------- */
  function start() {
    resizeStars();
    setWater();
    updateRing();
    requestAnimationFrame(loop);
    setTimeout(() => previewCategory(CATS[0]), 600);
    jar.classList.add('show-tag');
    setTimeout(() => jar.classList.remove('show-tag'), 5200);

    // 视差
    const earth = $('.earth');
    const orbit = $('.orbit-line');
    $('#app').addEventListener('pointermove', (e) => {
      const r = $('#app').getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width - 0.5;
      const ny = (e.clientY - r.top) / r.height - 0.5;
      if (earth) earth.style.transform = `translate3d(${(-nx * 20).toFixed(1)}px,${(-ny * 10).toFixed(1)}px,0)`;
      if (orbit) orbit.style.transform = `rotate(-7deg) translate3d(${(-nx * 14).toFixed(1)}px,0,0)`;
    });

    // 开场提示
    setTimeout(() => toast('拖动圆环切换版块 · 点击中央卡片开始播报'), 2600);
  }

  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { resizeStars(); ringDirty = true; }, 160);
  });

  start();
})();

</script>
</body>
